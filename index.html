<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Speak</title>
<style>
  :root{
    --bg:#f6f5f3; --panel:#fff; --ink:#16151a; --muted:#6b6a72;
    --line:#e2e0dc; --accent:#2f5bd8; --accent-ink:#fff;
    --shadow:0 1px 2px rgba(0,0,0,.05),0 8px 24px rgba(0,0,0,.06);
    --errbg:#fdeaea; --errline:#f5bcbc; --errink:#8a2020;
    --warnbg:#fff4e5; --warnline:#ffd9a0; --warnink:#6b4a10;
    --track:#e8e6e2;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#131316; --panel:#1c1c20; --ink:#f0eff2; --muted:#9b9aa3;
      --line:#2e2e34; --accent:#7c9bff; --accent-ink:#10101a;
      --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.3);
      --errbg:#2d1616; --errline:#5e2626; --errink:#ffb4b4;
      --warnbg:#2b2113; --warnline:#5c4620; --warnink:#f0d5a8;
      --track:#2a2a30;
    }
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font:15px/1.55 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
    display:flex; justify-content:center; padding:40px 16px 64px;
    -webkit-text-size-adjust:100%;
  }
  main{width:100%; max-width:680px}
  h1{font-size:26px; letter-spacing:-.02em; margin:0 0 4px}
  .sub{color:var(--muted); margin:0 0 24px; font-size:14px}
  .card{background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:18px; box-shadow:var(--shadow)}
  textarea{
    width:100%; min-height:180px; resize:vertical; padding:14px;
    background:transparent; color:var(--ink); border:1px solid var(--line);
    border-radius:10px; font:inherit; line-height:1.6; font-size:16px;
  }
  textarea:focus{outline:2px solid var(--accent); outline-offset:1px; border-color:transparent}
  label{font-size:12px; color:var(--muted); display:block; margin-bottom:5px; letter-spacing:.02em}
  select{
    padding:10px; border-radius:9px; border:1px solid var(--line);
    background:var(--panel); color:var(--ink); font:inherit; font-size:16px; width:100%;
  }
  .row{margin-top:14px}
  .sliders{display:flex; gap:16px; margin-top:14px; flex-wrap:wrap}
  .sliders>div{flex:1; min-width:140px}
  input[type=range]{width:100%; accent-color:var(--accent)}
  .buttons{display:flex; gap:10px; flex-wrap:wrap; margin-top:16px; align-items:center}
  button{
    padding:12px 20px; border-radius:9px; border:1px solid var(--line);
    background:var(--panel); color:var(--ink); font:inherit; font-weight:500; cursor:pointer;
    -webkit-tap-highlight-color:transparent;
  }
  button:hover:not(:disabled){border-color:var(--muted)}
  button.primary{background:var(--accent); color:var(--accent-ink); border-color:transparent}
  button:disabled{opacity:.45; cursor:not-allowed}
  a.dl{text-decoration:none}
  .count{margin-left:auto; font-size:12px; color:var(--muted); font-variant-numeric:tabular-nums}
  .status{margin-top:14px; font-size:13px; color:var(--muted); min-height:20px}
  .bar{height:4px; background:var(--track); border-radius:2px; overflow:hidden; margin-top:12px}
  .bar>i{display:block; height:100%; width:0; background:var(--accent); transition:width .3s ease}
  .banner{padding:12px 14px; border-radius:10px; font-size:14px; border:1px solid; margin-top:14px}
  .banner.err{background:var(--errbg); border-color:var(--errline); color:var(--errink)}
  .banner.warn{background:var(--warnbg); border-color:var(--warnline); color:var(--warnink); margin:0 0 18px}
  code{font-family:ui-monospace,Consolas,monospace; font-size:.9em}
  .hide{display:none}
  .spin{display:inline-block; width:11px; height:11px; border:2px solid currentColor;
        border-right-color:transparent; border-radius:50%; animation:sp .7s linear infinite;
        vertical-align:-1px; margin-right:6px}
  @keyframes sp{to{transform:rotate(360deg)}}
  footer{margin-top:18px; font-size:12px; color:var(--muted); text-align:center}
</style>
</head>
<body>
<main>
  <h1>Speak</h1>
  <p class="sub">Paste text, pick a voice, press play.</p>

  <div id="setup" class="banner warn hide">
    <strong>Not connected.</strong> Set <code>WORKER_URL</code> in the script to your
    Cloudflare Worker. Falling back to this browser's built-in voices for now.
  </div>

  <div class="card">
    <textarea id="text" placeholder="Paste or type your text here…" spellcheck="false"></textarea>

    <div class="row">
      <label for="voice">Voice</label>
      <select id="voice"></select>
    </div>

    <div class="sliders">
      <div>
        <label for="rate">Speed &middot; <span id="rateVal">1.0</span>&times;</label>
        <input type="range" id="rate" min="0.5" max="2" step="0.1" value="1">
      </div>
      <div>
        <label for="pitch">Pitch &middot; <span id="pitchVal">0</span></label>
        <input type="range" id="pitch" min="-10" max="10" step="1" value="0">
      </div>
    </div>

    <div class="buttons">
      <button id="speak" class="primary">▶ Speak</button>
      <button id="stop" disabled>⏹ Stop</button>
      <span class="count"><span id="chars">0</span> characters</span>
    </div>

    <div class="bar hide" id="bar"><i id="barFill"></i></div>
    <div class="status" id="status">Ready.</div>
    <div id="error" class="banner err hide"></div>
  </div>

  <audio id="player" class="hide" playsinline preload="auto"></audio>
  <footer id="foot"></footer>
</main>

<script>
(function () {
  // ─────────────────────────────────────────────────────────────
  // Your deployed Cloudflare Worker, e.g.
  //   'https://liam-tts.your-name.workers.dev'
  var WORKER_URL = '';
  // ─────────────────────────────────────────────────────────────

  // Google Cloud neural voices. Add any Neural2 voice name here.
  var VOICES = [
    ['en-US-Neural2-D', 'Neural D — American male'],
    ['en-US-Neural2-J', 'Neural J — American male'],
    ['en-GB-Neural2-D', 'Neural D — British male'],
    ['en-GB-Neural2-B', 'Neural B — British male'],
    ['en-AU-Neural2-B', 'Neural B — Australian male'],
    ['en-US-Neural2-F', 'Neural F — American female'],
    ['en-GB-Neural2-A', 'Neural A — British female'],
    ['en-AU-Neural2-A', 'Neural A — Australian female']
  ];

  // The first chunk is deliberately small so playback starts fast; later chunks are
  // bigger because they're fetched while earlier audio is still playing.
  var FIRST_CHUNK = 220;
  var CHUNK = 700;
  var LOOKAHEAD = 2;        // chunks fetched ahead of what's playing

  var $ = function (id) { return document.getElementById(id); };
  var textEl = $('text'), voiceEl = $('voice'), statusEl = $('status'), errEl = $('error');
  var speakBtn = $('speak'), stopBtn = $('stop'), player = $('player');
  var rate = $('rate'), pitch = $('pitch'), charsEl = $('chars');
  var bar = $('bar'), barFill = $('barFill');

  var useWorker = !!WORKER_URL;
  var browserVoices = [];
  var cancelled = false, running = false, unlocked = false;
  var urls = [];

  function say(m) { statusEl.textContent = m; }
  function fail(m) { errEl.textContent = m; errEl.classList.remove('hide'); }
  function clearErr() { errEl.classList.add('hide'); }
  function progress(p) {
    if (p == null) { bar.classList.add('hide'); return; }
    bar.classList.remove('hide');
    barFill.style.width = Math.max(0, Math.min(100, p)) + '%';
  }

  // ── Voices ───────────────────────────────────────────────────
  if (useWorker) {
    VOICES.forEach(function (v) {
      var o = document.createElement('option');
      o.value = v[0]; o.textContent = v[1];
      voiceEl.appendChild(o);
    });
    $('foot').textContent = 'Same voice for every visitor, on every browser.';
  } else {
    $('setup').classList.remove('hide');
    if (window.speechSynthesis) {
      var load = function () {
        var all = speechSynthesis.getVoices();
        browserVoices = all.filter(function (v) { return /^en/i.test(v.lang); });
        if (!browserVoices.length) browserVoices = all;
        if (!browserVoices.length) return;
        voiceEl.innerHTML = '';
        browserVoices.forEach(function (v, i) {
          var o = document.createElement('option');
          o.value = i; o.textContent = v.name + ' (' + v.lang + ')';
          voiceEl.appendChild(o);
        });
      };
      load();
      speechSynthesis.onvoiceschanged = load;   // getVoices() is empty on first call
    }
  }

  // ── Split text on sentence boundaries ────────────────────────
  function chunkText(t) {
    var sentences = t.replace(/\s+/g, ' ').trim()
      .match(/[^.!?…]+[.!?…]+["'’)\]]*|\S[^.!?…]*$/g) || [];
    var out = [], buf = '', limit = FIRST_CHUNK;

    for (var i = 0; i < sentences.length; i++) {
      var s = sentences[i].trim();
      if (!s) continue;

      // Break an over-long sentence at a comma, then at a space.
      while (s.length > limit * 2) {
        if (buf) { out.push(buf); buf = ''; limit = CHUNK; }
        var cut = s.lastIndexOf(',', limit);
        if (cut < limit / 3) cut = s.lastIndexOf(' ', limit);
        if (cut < 1) cut = limit;
        out.push(s.slice(0, cut + 1).trim());
        s = s.slice(cut + 1).trim();
        limit = CHUNK;
      }

      if (buf && (buf + ' ' + s).length > limit) {
        out.push(buf); buf = s; limit = CHUNK;
      } else {
        buf = buf ? buf + ' ' + s : s;
      }
    }
    if (buf) out.push(buf);
    return out;
  }

  // ── iOS: audio must be started by a user gesture ─────────────
  // Generation is async, so by playback time the gesture is gone. Priming the element
  // with a silent clip during the tap keeps it playable for the rest of the session.
  var SILENT = 'data:audio/mpeg;base64,SUQzBAAAAAAAI1RTU0UAAAAPAAADTGF2ZjU4Ljc2LjEwMAAAAAAAAAAAAAAA//tAwAAAAAAAAAAAAAAAAAAAAAAASW5mbwAAAA8AAAAEAAABIADAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA//////////////////////////////////////////8AAAAATGF2YzU4LjEzAAAAAAAAAAAAAAAAJAAAAAAAAAAAASDs90hvAAAAAAAAAAAAAAAAAAAA//sQxAADwAABpAAAACAAADSAAAAETEFNRTMuMTAwVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVV';

  function unlock() {
    if (unlocked) return;
    try {
      player.src = SILENT;
      var p = player.play();
      if (p && p.then) p.then(function () { unlocked = true; }).catch(function () {});
    } catch (e) {}
  }

  function playUrl(url) {
    return new Promise(function (resolve, reject) {
      player.src = url;
      player.onended = resolve;
      player.onerror = function () { reject(new Error('Playback failed')); };
      var p = player.play();
      if (p && p.catch) p.catch(reject);
    });
  }

  function fetchChunk(text) {
    return fetch(WORKER_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        text: text, voice: voiceEl.value,
        rate: +rate.value, pitch: +pitch.value
      })
    }).then(function (r) {
      if (!r.ok) return r.text().then(function (t) { throw new Error(t || ('HTTP ' + r.status)); });
      return r.blob();
    }).then(function (b) {
      var u = URL.createObjectURL(b);
      urls.push(u);
      return u;
    });
  }

  // ── UI ───────────────────────────────────────────────────────
  textEl.addEventListener('input', function () { charsEl.textContent = textEl.value.length; });
  rate.oninput  = function () { $('rateVal').textContent  = (+rate.value).toFixed(1); };
  pitch.oninput = function () { $('pitchVal').textContent = pitch.value; };

  function busy(on) {
    speakBtn.disabled = on;
    stopBtn.disabled = !on;
    speakBtn.innerHTML = on ? '<span class="spin"></span>Speaking…' : '▶ Speak';
  }

  function cleanup() {
    urls.forEach(function (u) { URL.revokeObjectURL(u); });
    urls = [];
  }

  // ── Speak ────────────────────────────────────────────────────
  speakBtn.onclick = function () {
    if (running) return;
    unlock();                       // synchronous, inside the gesture — required by iOS
    clearErr();

    var text = textEl.value.trim();
    if (!text) { say('Nothing to read — paste some text first.'); textEl.focus(); return; }

    cancelled = false; running = true;
    busy(true); cleanup();

    if (!useWorker) return speakLocal(text);

    var chunks = chunkText(text);
    var label = voiceEl.options[voiceEl.selectedIndex].textContent;
    var queue = [];                 // promises, one per chunk, started ahead of playback

    say('Connecting…');
    progress(0);

    for (var i = 0; i < Math.min(LOOKAHEAD, chunks.length); i++) {
      queue[i] = fetchChunk(chunks[i]);
    }

    var i2 = 0;
    (function next() {
      if (cancelled || i2 >= chunks.length) {
        if (!cancelled) { say('Done.'); progress(100); setTimeout(function(){progress(null);}, 600); }
        busy(false); running = false;
        return;
      }

      var idx = i2++;
      // Keep the pipeline topped up so the next chunk is ready before this one ends.
      var ahead = idx + LOOKAHEAD;
      if (ahead < chunks.length && !queue[ahead]) queue[ahead] = fetchChunk(chunks[ahead]);

      queue[idx].then(function (url) {
        if (cancelled) throw new Error('cancelled');
        say(chunks.length > 1
          ? label + ' — part ' + (idx + 1) + ' of ' + chunks.length
          : 'Playing ' + label + '…');
        progress((idx / chunks.length) * 100);
        return playUrl(url);
      }).then(next).catch(function (e) {
        busy(false); running = false; progress(null);
        if (cancelled) { say('Stopped.'); return; }
        fail(e.name === 'NotAllowedError'
          ? 'Your browser blocked autoplay. Tap Speak again.'
          : e.message);
        say('');
      });
    })();
  };

  function speakLocal(text) {
    if (!window.speechSynthesis) { fail('No speech support in this browser.'); busy(false); running = false; return; }
    speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(text);
    var v = browserVoices[voiceEl.value];
    if (v) { u.voice = v; u.lang = v.lang; }
    u.rate = +rate.value;
    u.pitch = 1 + (+pitch.value / 10);
    u.onstart = function () { say('Speaking with ' + (v ? v.name : 'default') + '…'); };
    u.onend   = function () { busy(false); running = false; say('Done.'); };
    u.onerror = function () { busy(false); running = false; say('Stopped.'); };
    speechSynthesis.speak(u);
  }

  stopBtn.onclick = function () {
    cancelled = true;
    player.pause(); player.currentTime = 0; player.onended = null;
    if (!useWorker && window.speechSynthesis) speechSynthesis.cancel();
    busy(false); running = false; progress(null);
    say('Stopped.');
  };
})();
</script>
</body>
</html>
