<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Speak</title>
<style>
  :root{
    --bg:#f6f5f3; --panel:#fff; --ink:#16151a; --muted:#6b6a72;
    --line:#e2e0dc; --accent:#2f5bd8; --accent-ink:#fff;
    --shadow:0 1px 2px rgba(0,0,0,.05),0 8px 24px rgba(0,0,0,.06);
    --errbg:#fdeaea; --errline:#f5bcbc; --errink:#8a2020;
    --warnbg:#fff4e5; --warnline:#ffd9a0; --warnink:#6b4a10;
    --track:#e8e6e2;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#131316; --panel:#1c1c20; --ink:#f0eff2; --muted:#9b9aa3;
      --line:#2e2e34; --accent:#7c9bff; --accent-ink:#10101a;
      --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.3);
      --errbg:#2d1616; --errline:#5e2626; --errink:#ffb4b4;
      --warnbg:#2b2113; --warnline:#5c4620; --warnink:#f0d5a8;
      --track:#2a2a30;
    }
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font:16px/1.6 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
    display:flex; justify-content:center; padding:36px 16px 64px;
    -webkit-text-size-adjust:100%;
  }
  main{width:100%; max-width:1080px}
  h1{font-size:32px; letter-spacing:-.02em; margin:0 0 4px}
  .sub{color:var(--muted); margin:0 0 22px; font-size:15px}
  .card{background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:24px; box-shadow:var(--shadow)}
  textarea{
    width:100%; min-height:52vh; resize:vertical; padding:22px 24px;
    background:transparent; color:var(--ink); border:1px solid var(--line);
    border-radius:10px; font:inherit; line-height:1.9; font-size:18px;
  }
  textarea:focus{outline:2px solid var(--accent); outline-offset:1px; border-color:transparent}
  label{font-size:12px; color:var(--muted); display:block; margin-bottom:5px; letter-spacing:.02em}
  select{
    padding:10px; border-radius:9px; border:1px solid var(--line);
    background:var(--panel); color:var(--ink); font:inherit; font-size:16px; width:100%;
  }
  .linktoggle{margin:0 0 10px; display:block}
  .urlpanel{
    border:1px solid var(--line); border-radius:10px;
    padding:12px; margin-bottom:12px;
  }
  .urlrow{display:flex; align-items:center; gap:8px; margin-bottom:7px}
  .urlrow .num{
    flex:0 0 22px; height:22px; border-radius:50%; background:var(--track);
    color:var(--muted); font-size:12px; display:flex; align-items:center;
    justify-content:center; font-variant-numeric:tabular-nums;
  }
  .urlpanel input{
    flex:1; min-width:0; padding:12px 14px; border-radius:9px;
    border:1px solid var(--line); background:transparent; color:var(--ink);
    font:inherit; font-size:16px;
  }
  .urlpanel input:focus{outline:2px solid var(--accent); outline-offset:1px; border-color:transparent}
  .chain{
    display:flex; align-items:center; gap:7px; margin:10px 0 0;
    font-size:13px; color:var(--muted);
  }
  .chain input{
    flex:0 0 62px; width:62px; padding:6px 8px; text-align:center;
    border-radius:8px; border:1px solid var(--line);
    background:transparent; color:var(--ink); font:inherit; font-size:15px;
  }
  .hist{margin-top:14px; border-top:1px solid var(--line); padding-top:12px}
  .histhead{
    display:flex; align-items:center; justify-content:space-between;
    font-size:12px; color:var(--muted); letter-spacing:.02em;
  }
  .histhead button{margin:0}
  .hist ul{list-style:none; margin:8px 0 0; padding:0; max-height:170px; overflow-y:auto}
  .hist li{
    display:flex; align-items:center; gap:8px; padding:5px 6px;
    border-radius:7px; font-size:13px;
  }
  .hist li:hover{background:var(--track)}
  .hist li button.pick{
    flex:1; min-width:0; text-align:left; background:none; border:0; padding:4px 2px;
    color:var(--ink); font:inherit; font-size:13px; cursor:pointer;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .hist li button.del{
    flex:0 0 auto; padding:2px 8px; font-size:14px; line-height:1.4;
    color:var(--muted); background:none; border:0; cursor:pointer; margin:0;
  }
  .hist li button.del:hover{color:var(--errink)}
  .urlbtns{display:flex; gap:8px; flex-wrap:wrap; margin-top:10px}
  .urlbtns button{padding:9px 16px; font-size:14px; white-space:nowrap}
  .reader{
    max-height:64vh; overflow-y:auto; padding:22px 24px; border:1px solid var(--line);
    border-radius:10px; line-height:2; font-size:18px;
    -webkit-overflow-scrolling:touch;
  }
  .reader .para{margin:0 0 1.1em; cursor:pointer; border-radius:6px; padding:2px 4px; margin-left:-4px}
  .reader .para:hover{background:color-mix(in srgb, var(--accent) 10%, transparent)}
  .reader .para:last-child{margin-bottom:0}
  .reader .chunk{color:var(--muted); transition:color .2s}
  .reader .chunk.done{color:var(--muted); opacity:.55}
  .reader .chunk.live{color:var(--ink)}
  .reader .w{border-radius:4px; padding:1px 0}
  .reader .w.spoken{color:var(--ink)}
  .reader .w.now{background:var(--accent); color:var(--accent-ink); padding:1px 3px; margin:0 -3px}
  .ghost{margin-top:10px; padding:7px 12px; font-size:13px}
  .row{margin-top:14px}
  .sliders{display:flex; gap:16px; margin-top:14px; flex-wrap:wrap}
  .sliders>div{flex:1; min-width:140px}
  input[type=range]{width:100%; accent-color:var(--accent)}
  .buttons{display:flex; gap:10px; flex-wrap:wrap; margin-top:16px; align-items:center}
  button{
    padding:12px 20px; border-radius:9px; border:1px solid var(--line);
    background:var(--panel); color:var(--ink); font:inherit; font-weight:500; cursor:pointer;
    -webkit-tap-highlight-color:transparent;
  }
  button:hover:not(:disabled){border-color:var(--muted)}
  button.primary{background:var(--accent); color:var(--accent-ink); border-color:transparent}
  button:disabled{opacity:.45; cursor:not-allowed}
  a.dl{text-decoration:none}
  .count{margin-left:auto; font-size:12px; color:var(--muted); font-variant-numeric:tabular-nums}
  .status{margin-top:10px; font-size:14px; color:var(--muted); min-height:20px}
  .bar{height:10px; background:var(--track); border-radius:2px; overflow:hidden; margin-top:12px}
  .bar>i{display:block; height:100%; width:0; background:var(--accent); transition:width .3s ease}
  .banner{padding:12px 14px; border-radius:10px; font-size:14px; border:1px solid; margin-top:14px}
  .banner.err{background:var(--errbg); border-color:var(--errline); color:var(--errink)}
  .banner.warn{background:var(--warnbg); border-color:var(--warnline); color:var(--warnink); margin:0 0 18px}
  code{font-family:ui-monospace,Consolas,monospace; font-size:.9em}
  .hide{display:none}
  .spin{display:inline-block; width:11px; height:11px; border:2px solid currentColor;
        border-right-color:transparent; border-radius:50%; animation:sp .7s linear infinite;
        vertical-align:-1px; margin-right:6px}
  @keyframes sp{to{transform:rotate(360deg)}}
  footer{margin-top:18px; font-size:12px; color:var(--muted); text-align:center}
</style>
</head>
<body>
<main>
  <h1>Speak</h1>
  <p class="sub">Paste text, pick a voice, press play.</p>

  <div id="setup" class="banner warn hide">
    <strong>Not connected.</strong> Set <code>WORKER_URL</code> in the script to your
    Cloudflare Worker. Falling back to this browser's built-in voices for now.
  </div>

  <div class="card">
    <button id="toggleLinks" class="ghost linktoggle" type="button"
            aria-expanded="false">▸ Load from links</button>

    <div class="urlpanel hide" id="urlpanel">
      <div class="urlrow">
        <input class="url" type="url" inputmode="url" spellcheck="false"
               placeholder="paste a chapter link">
      </div>

      <label class="chain">
        <span>read</span>
        <input id="chainN" type="number" min="1" max="15" step="1" value="1">
        <span>chapters from here</span>
      </label>

      <div class="urlbtns">
        <button id="load" type="button">Load</button>
        <button id="add" type="button">+ Add</button>
        <button id="clearLinks" type="button" class="ghost">Clear</button>
      </div>

      <div class="hist hide" id="hist">
        <div class="histhead">
          <span id="histCount">Recently loaded</span>
          <button id="clearHist" type="button" class="ghost">Clear all</button>
        </div>
        <ul id="histList"></ul>
      </div>
    </div>

    <textarea id="text" placeholder="Paste or type your text here…" spellcheck="false"></textarea>
    <div id="reader" class="reader hide" aria-live="off"></div>
    <button id="edit" class="ghost hide" type="button">✎ Edit text</button>

    <div class="row">
      <label for="voice">Voice</label>
      <select id="voice"></select>
    </div>

    <div class="sliders">
      <div>
        <label for="rate">Speed &middot; <span id="rateVal">1.0</span>&times;</label>
        <input type="range" id="rate" min="0.5" max="2" step="0.1" value="1">
      </div>
      <div>
        <label for="pitch">Pitch &middot; <span id="pitchVal">0</span></label>
        <input type="range" id="pitch" min="-10" max="10" step="1" value="0">
      </div>
    </div>

    <div class="buttons">
      <button id="speak" class="primary">▶ Speak</button>
      <button id="stop" disabled>⏹ Stop</button>
      <span class="count"><span id="chars">0</span> characters</span>
    </div>

    <div class="bar hide" id="bar"><i id="barFill"></i></div>
    <div class="status" id="status">Ready.</div>
    <div id="error" class="banner err hide"></div>
  </div>

  <audio id="player" class="hide" playsinline preload="auto"></audio>
  <footer id="foot"></footer>
</main>

  function chunkText(t) {

  // Playback state lives out here so a click on a paragraph can jump into it.

  function playFrom(start) {
    var myRun = ++runId;
    cancelled = false;
    running = true;
    busy(true);

    player.pause();
    player.onended = null;
    player.ontimeupdate = null;
    if (lastWord) { lastWord.classList.remove('now'); lastWord = null; }

    // Everything from here on is unread again.
    chunkEls.forEach(function (cs, i) {
      if (i >= start) {
        cs.classList.remove('done', 'live');
        cs.__words.forEach(function (w) { w.classList.remove('spoken', 'now'); });
      }
    });

    say('Connecting…');
    progress((start / curChunks.length) * 100);

    for (var i = start; i < Math.min(start + LOOKAHEAD, curChunks.length); i++) {
      if (!curQueue[i]) curQueue[i] = fetchChunk(curChunks[i].text);
    }

    var i2 = start;
    (function next() {
      if (myRun !== runId) return;            // a jump superseded this loop
      if (cancelled || i2 >= curChunks.length) {
        if (!cancelled) { say('Done.'); progress(100); setTimeout(function(){progress(null);}, 600); }
        busy(false); running = false;
        return;

      var idx = i2++;

      var ahead = idx + LOOKAHEAD;
      if (ahead < curChunks.length && !curQueue[ahead]) curQueue[ahead] = fetchChunk(curChunks[ahead].text);

      curQueue[idx].then(function (url) {
        if (myRun !== runId) return;
        if (cancelled) throw new Error('cancelled');

          ? curLabel + ' — part ' + (idx + 1) + ' of ' + curChunks.length
          : 'Playing ' + curLabel + '…');

        return playUrl(url, cs);

        if (myRun === runId) next();
      }).catch(function (e) {

    say('Stopped.');
  };
})();
</script>
