<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Speak</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&display=swap">
<style>
  /* ── Tokens. Light authored first; dark authored, not derived. ────────── */
  :root{
    --room:#E8E5DF; --page:#FBFAF7; --surface-2:#F4F2ED; --surface-3:#FFFFFF;
    --rule:#DCD8D0; --rule-strong:#C3BEB3;

    /* Ink by reading state. AHEAD of the voice is full ink — eyes read ahead. */
    --ink:#17191D; --ink-2:#4A4D53; --ink-3:#6E7178; --ink-spent:#6F6D67;

    /* ember = "the voice is here". Nothing else may use it. */
    --ember:#A85409; --ember-wash:rgba(168,84,9,.13);
    --rail-played:rgba(168,84,9,.72);

    --spine:#CBC6BC; --spine-lit:#9A948A;
    --alert:#B3261E; --alert-wash:rgba(179,38,30,.10);
    --warn-wash:rgba(168,84,9,.09);
    --dock-shadow:0 -1px 0 var(--rule), 0 -10px 24px rgba(40,30,14,.07);

    --font-prose:'Literata',Georgia,'Times New Roman',serif;
    --font-ui:'Archivo',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;

    --r-chip:6px; --r-field:10px; --r-round:999px;
    --s-1:4px; --s-2:8px; --s-3:12px; --s-4:16px; --s-5:24px;
    --s-6:32px; --s-7:48px; --s-8:64px;
    --h-micro:28px; --h-chip:32px; --h-row:44px; --h-field:56px;
    --bar-head:48px; --bar-dock:64px;
    --measure:60ch; --spine-gutter:28px;
    --t-fast:120ms; --t-base:160ms; --ease:cubic-bezier(.2,.7,.3,1);
  }
  @media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
    --room:#0C0D10; --page:#0C0D10; --surface-2:#16191D; --surface-3:#07080A;
    --rule:#262A30; --rule-strong:#363B43;
    --ink:#C6C1B7; --ink-2:#A6A7AB; --ink-3:#85888F; --ink-spent:#878379;
    --ember:#FF9E3D; --ember-wash:rgba(255,158,61,.16);
    --rail-played:rgba(255,158,61,.72);
    --spine:#31353C; --spine-lit:#5E636B;
    --alert:#FF8A7A; --alert-wash:rgba(255,138,122,.12);
    --warn-wash:rgba(255,158,61,.10);
    --dock-shadow:0 -1px 0 var(--rule), 0 -14px 32px rgba(0,0,0,.55);
  }}
  :root[data-theme="dark"]{
    --room:#0C0D10; --page:#0C0D10; --surface-2:#16191D; --surface-3:#07080A;
    --rule:#262A30; --rule-strong:#363B43;
    --ink:#C6C1B7; --ink-2:#A6A7AB; --ink-3:#85888F; --ink-spent:#878379;
    --ember:#FF9E3D; --ember-wash:rgba(255,158,61,.16);
    --rail-played:rgba(255,158,61,.72);
    --spine:#31353C; --spine-lit:#5E636B;
    --alert:#FF8A7A; --alert-wash:rgba(255,138,122,.12);
    --warn-wash:rgba(255,158,61,.10);
    --dock-shadow:0 -1px 0 var(--rule), 0 -14px 32px rgba(0,0,0,.55);
  }
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{transition-duration:1ms !important; animation-duration:1ms !important}
  }

  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0; background:var(--room); color:var(--ink);
    font:400 13px/1.5 var(--font-ui);
    -webkit-font-smoothing:antialiased;
    padding-bottom:calc(var(--bar-dock) + env(safe-area-inset-bottom));
  }
  button{font:inherit; color:inherit; cursor:pointer; background:none; border:0}
  .hide{display:none !important}

  /* ── Header ───────────────────────────────────────────────────────────── */
  .topbar{
    position:sticky; top:0; z-index:40; height:var(--bar-head);
    display:flex; align-items:center; gap:var(--s-3);
    padding:0 var(--s-5); background:var(--room);
    border-bottom:1px solid var(--rule);
    transition:border-color var(--t-fast) var(--ease);
  }
  .wordmark{
    font-size:11px; font-weight:700; letter-spacing:.18em; text-transform:uppercase;
    color:var(--ink-3); margin:0;
  }
  #chapterId{
    font-size:11px; font-weight:700; letter-spacing:.12em; text-transform:uppercase;
    color:var(--ink-3); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    max-width:46vw;
  }
  .topbar .spacer{flex:1}
  #partCount{
    font-size:11px; letter-spacing:.04em; color:var(--ink-3);
    font-variant-numeric:tabular-nums; white-space:nowrap;
  }

  /* ── Chips and buttons ────────────────────────────────────────────────── */
  .chip{
    height:var(--h-chip); padding:0 var(--s-3); border-radius:var(--r-chip);
    border:1px solid var(--rule-strong); color:var(--ink-2);
    font-size:13px; font-weight:500; display:inline-flex; align-items:center; gap:6px;
    transition:color var(--t-fast) var(--ease), border-color var(--t-fast) var(--ease);
  }
  .chip:hover{color:var(--ink); border-color:var(--ink-3)}
  .chip:active{transform:scale(.97)}
  .chip.micro{height:var(--h-micro); padding:0 var(--s-2); font-size:11px}
  .btn{
    height:var(--h-row); padding:0 var(--s-5); border-radius:var(--r-chip);
    border:1px solid var(--rule-strong); color:var(--ink);
    font-size:15px; font-weight:600; letter-spacing:-.005em;
    display:inline-flex; align-items:center; justify-content:center;
    transition:border-color var(--t-fast) var(--ease), filter var(--t-fast) var(--ease);
  }
  .btn:hover:not(:disabled){border-color:var(--ink-3)}
  .btn:active:not(:disabled){transform:scale(.98)}
  .btn.solid{background:var(--ink); color:var(--page); border-color:transparent}
  .btn.solid:hover:not(:disabled){filter:brightness(1.18)}
  .btn:disabled,.chip:disabled{opacity:.4; cursor:not-allowed}
  .ghost{
    border:0; color:var(--ink-3); font-size:13px; font-weight:500;
    padding:6px 0; transition:color var(--t-fast) var(--ease);
  }
  .ghost:hover{color:var(--ink)}
  :focus-visible{outline:2px solid var(--ember); outline-offset:2px; border-radius:2px}

  /* ── Setup room ───────────────────────────────────────────────────────── */
  .setup{max-width:720px; margin:0 auto; padding:var(--s-7) var(--s-6) var(--s-8)}

  /* The command field is the focal element of setup. */
  #text{
    display:block; width:100%; min-height:var(--h-field); height:var(--h-field);
    max-height:52vh; resize:none; overflow:hidden;
    padding:var(--s-4) var(--s-5);
    background:var(--surface-3); color:var(--ink);
    border:1px solid var(--rule-strong); border-radius:var(--r-field);
    font:400 19px/1.6 var(--font-prose);
    transition:border-color var(--t-fast) var(--ease), box-shadow var(--t-fast) var(--ease);
  }
  #text::placeholder{color:var(--ink-3); font-style:italic}
  #text:focus{
    outline:0; border-color:var(--ember);
    box-shadow:0 0 0 3px var(--ember-wash);
  }
  body.has-text #text{height:auto; min-height:32vh; overflow:auto; resize:vertical}

  .loadrow{
    display:flex; align-items:center; gap:var(--s-4);
    margin-top:var(--s-4); flex-wrap:wrap;
  }
  .stepper{
    display:inline-flex; align-items:center; gap:var(--s-2);
    font-size:13px; color:var(--ink-3);
  }
  #chainN{
    width:58px; height:var(--h-micro); text-align:center;
    background:var(--surface-3); color:var(--ink);
    border:1px solid var(--rule-strong); border-radius:var(--r-chip);
    font:400 16px/1 var(--font-ui); font-variant-numeric:tabular-nums;
  }
  .loadrow .spacer{flex:1}
  .urlrow{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap}

  /* ── History ──────────────────────────────────────────────────────────── */
  #hist{margin-top:var(--s-7); border-top:1px solid var(--rule); padding-top:var(--s-4)}
  .histhead{display:flex; align-items:center; justify-content:space-between}
  .histtoggle{font-size:11px; font-weight:700; letter-spacing:.12em; text-transform:uppercase}
  #histList{list-style:none; margin:var(--s-2) 0 0; padding:0; max-height:288px; overflow-y:auto}
  #histList li{
    display:flex; align-items:center; gap:var(--s-3); height:var(--h-row);
    border-bottom:1px solid var(--rule);
  }
  #histList li:last-child{border-bottom:0}
  #histList button.pick{
    flex:1; min-width:0; text-align:left; font-size:13px; font-weight:500;
    color:var(--ink-2); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
    transition:color var(--t-fast) var(--ease);
  }
  #histList li:hover button.pick{color:var(--ink)}
  #histList button.del{
    width:var(--h-micro); height:var(--h-micro); color:var(--ink-3); font-size:15px;
    display:flex; align-items:center; justify-content:center; border-radius:var(--r-chip);
  }
  #histList button.del:hover{color:var(--alert)}

  /* ── Quota rule ───────────────────────────────────────────────────────── */
  .quota{margin-top:var(--s-7)}
  .quotabar{height:2px; background:var(--rule); overflow:hidden}
  .quotabar>i{display:block; height:100%; width:0; background:var(--ink-3); transition:width var(--t-base) var(--ease)}
  #quotaText{
    display:block; margin-top:var(--s-2);
    font-size:11px; letter-spacing:.04em; color:var(--ink-3);
    font-variant-numeric:tabular-nums;
  }
  #foot{margin-top:var(--s-2); font-size:11px; color:var(--ink-3)}

  /* ── Signals ──────────────────────────────────────────────────────────── */
  .banner{
    padding:var(--s-3) var(--s-4); margin-top:var(--s-4);
    font-size:13px; border-left:2px solid; border-radius:0;
  }
  .banner.err{background:var(--alert-wash); border-color:var(--alert); color:var(--alert)}
  .banner.warn{background:var(--warn-wash); border-color:var(--ember); color:var(--ink-2)}
  #status{font-size:13px; color:var(--ink-3); min-height:20px; margin-top:var(--s-3)}

  /* ── Reading room ─────────────────────────────────────────────────────── */
  .readwrap{position:relative; max-width:calc(var(--measure) + 160px); margin:0 auto; padding:var(--s-6) var(--s-6) 45vh}
  #reader{
    max-width:var(--measure); margin:0 auto;
    font:400 19px/1.78 var(--font-prose);
    font-variation-settings:'opsz' 18;
    color:var(--ink); text-wrap:pretty;
  }
  #reader .para{
    margin:0 0 22px; cursor:pointer; border-radius:2px;
  }
  #reader .para:last-child{margin-bottom:0}

  /* THE BOUNDARY — ahead of the voice is full ink; behind it recedes. */
  #reader .chunk{color:var(--ink)}
  #reader .chunk.done{color:var(--ink-spent)}
  #reader .chunk.live{color:var(--ink)}
  #reader .w{color:inherit}
  #reader .w.spoken{color:var(--ink-spent)}
  #reader .w.now{
    color:var(--ink);
    background:linear-gradient(var(--ember-wash),var(--ember-wash)) padding-box,
               linear-gradient(var(--ember),var(--ember)) 0 calc(100% - 1px)/100% 1px no-repeat;
  }

  /* The spine — one tick per paragraph of this chapter. */
  .spine{
    position:fixed; left:max(var(--s-4), calc(50% - var(--measure)/2 - 40px));
    top:calc(var(--bar-head) + var(--s-4));
    width:var(--spine-gutter);
    height:calc(100dvh - var(--bar-head) - var(--bar-dock) - var(--s-6));
    z-index:20; touch-action:pan-y;
  }
  .spine i{
    position:absolute; left:0; display:block; height:2px;
    background:var(--spine); border-radius:1px; cursor:pointer;
    transition:width var(--t-base) var(--ease), background-color var(--t-base) var(--ease), height var(--t-base) var(--ease);
  }
  .spine i.lit{background:var(--spine-lit)}
  .spine i.at{background:var(--ember); height:3px}

  /* ── Dock ─────────────────────────────────────────────────────────────── */
  .dock{
    position:fixed; left:0; right:0; bottom:0; z-index:50;
    height:calc(var(--bar-dock) + env(safe-area-inset-bottom));
    padding:0 var(--s-5) env(safe-area-inset-bottom);
    display:flex; align-items:center; gap:var(--s-3);
    background:var(--surface-2); border-top:1px solid var(--rule);
    box-shadow:var(--dock-shadow);
  }
  .dock .spacer{flex:1; min-width:0}
  .dock #status{margin:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .transport{
    width:var(--h-row); height:var(--h-row); border-radius:var(--r-round);
    border:1px solid var(--ink-3); color:var(--ink);
    display:inline-flex; align-items:center; justify-content:center;
    font-size:15px; padding-left:2px;
    transition:border-color var(--t-fast) var(--ease), color var(--t-fast) var(--ease);
  }
  .transport:hover:not(:disabled){border-color:var(--ink)}
  .transport:active:not(:disabled){transform:scale(.97)}
  .transport:disabled{opacity:.35; cursor:not-allowed}
  #stop{
    width:var(--h-row); height:var(--h-row); border-radius:var(--r-chip);
    border:1px solid var(--rule-strong); color:var(--ink-2);
    display:inline-flex; align-items:center; justify-content:center;
  }
  #stop:hover:not(:disabled){color:var(--ink); border-color:var(--ink-3)}

  /* Queue rail, flush to the dock's top edge. */
  #bar{
    position:absolute; left:0; right:0; top:-3px; height:3px;
    background:var(--rule); overflow:hidden;
  }
  #bar>i{display:block; height:100%; width:0; background:var(--rail-played); transition:width var(--t-base) var(--ease)}

  #voice{
    height:var(--h-chip); max-width:210px; padding:0 var(--s-2);
    background:transparent; color:var(--ink-2);
    border:1px solid var(--rule-strong); border-radius:var(--r-chip);
    font:500 13px/1 var(--font-ui);
  }
  #voice:hover{color:var(--ink); border-color:var(--ink-3)}
  .speedwrap{display:inline-flex; align-items:center; gap:var(--s-2); font-size:13px; color:var(--ink-3)}
  #rate,#pitch{width:96px; height:20px; accent-color:var(--ember)}
  #rateVal,#pitchVal{font-variant-numeric:tabular-nums; color:var(--ink-2); font-weight:500}
  .pitchwrap{display:none}

  /* Chrome recedes while the voice is running. */
  body.running #chapterId,
  body.running #partCount,
  body.running .dock #status,
  body.running .speedwrap,
  body.running .wordmark{color:var(--ink-3)}

  /* ── Mobile ───────────────────────────────────────────────────────────── */
  @media (max-width:760px){
    :root{--measure:100%; --bar-dock:56px}
    .topbar{padding:0 var(--s-4); gap:var(--s-2)}
    .setup{padding:var(--s-6) var(--s-4) var(--s-8)}
    .readwrap{padding:var(--s-5) var(--s-4) 45vh var(--s-7)}
    #reader{font-size:18px; line-height:1.72}
    #text{font-size:18px; padding:var(--s-3) var(--s-4)}
    .spine{left:6px; width:20px}
    .dock{padding:0 var(--s-3) env(safe-area-inset-bottom); gap:var(--s-2)}
    #voice{max-width:116px}
    .speedwrap #rate{width:64px}
    .dock #status{display:none}
  }

  /* The link field — what he touches every chapter. */
  .urlrow{display:block; margin-bottom:var(--s-3); position:static; width:auto; height:auto; clip:auto; overflow:visible}
  .urlrow input{
    width:100%; height:var(--h-field); padding:0 var(--s-5);
    background:var(--surface-3); color:var(--ink);
    border:1px solid var(--rule-strong); border-radius:var(--r-field);
    font:400 16px/1 var(--font-ui);
    transition:border-color var(--t-fast) var(--ease), box-shadow var(--t-fast) var(--ease);
  }
  .urlrow input::placeholder{color:var(--ink-3)}
  .urlrow input:focus{outline:0; border-color:var(--ember); box-shadow:0 0 0 3px var(--ember-wash)}
  .fieldlabel{margin:var(--s-7) 0 var(--s-2)}
  .charline{
    margin-top:var(--s-2); font-size:11px; letter-spacing:.04em;
    color:var(--ink-3); font-variant-numeric:tabular-nums;
  }

  /* ── Chapter imagery ──────────────────────────────────────────────────── */
  /* The rail sits in the void to the right of the column and is absolutely
     positioned inside it, so it scrolls with the prose and each picture stays
     level with its paragraph. Opening it never reflows the text. */
  .imgrail{
    position:absolute; top:0; left:calc(100% + var(--s-5)); width:220px;
    display:none; pointer-events:none;
  }
  body.rail-open .imgrail{display:block; pointer-events:auto}
  .imgcard{
    margin:0; width:220px; border:1px solid var(--rule);
    background:var(--surface-2); cursor:zoom-in;
    transition:border-color var(--t-fast) var(--ease);
  }
  .imgcard:hover{border-color:var(--rule-strong)}
  .imgcard img{display:block; width:100%; height:auto; outline:1px solid rgba(0,0,0,.1); outline-offset:-1px}
  .imgcard figcaption{
    padding:var(--s-2) var(--s-3); font-size:11px; line-height:1.5;
    color:var(--ink-3); letter-spacing:.02em;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
  }
  .imgcard.open{cursor:zoom-out}
  .imgcard.open figcaption{-webkit-line-clamp:unset}

  /* The sheet is the phone's answer to the rail. */
  .imgsheet{
    position:fixed; left:0; right:0; bottom:0; z-index:60;
    max-height:78dvh; display:flex; flex-direction:column;
    background:var(--surface-2); border-top:1px solid var(--rule-strong);
    box-shadow:var(--dock-shadow);
    padding-bottom:env(safe-area-inset-bottom);
  }
  .sheethead{
    display:flex; align-items:center; justify-content:space-between;
    height:var(--h-row); padding:0 var(--s-4);
    border-bottom:1px solid var(--rule); flex:0 0 auto;
  }
  .sheethead button{
    width:var(--h-micro); height:var(--h-micro); color:var(--ink-3);
    display:flex; align-items:center; justify-content:center; border-radius:var(--r-chip);
  }
  .sheethead button:hover{color:var(--ink)}
  .sheetbody{
    flex:1; overflow-y:auto; padding:var(--s-4);
    display:grid; gap:var(--s-4); -webkit-overflow-scrolling:touch;
  }
  .sheetbody .imgcard{width:100%; position:static !important}

  @media (max-width:1200px){
    body.rail-open .imgrail{display:none}
  }
</style>
</head>
<body>
<header class="topbar">
  <h1 class="wordmark">Speak</h1>
  <span id="chapterId"></span>
  <span class="spacer"></span>
  <span id="partCount"></span>
  <button id="imgChip" class="chip hide" type="button"><span id="imgCount">0</span> images</button>
  <button id="edit" class="chip hide" type="button">Edit</button>
  <button id="theme" class="chip micro" type="button" aria-label="Switch theme">◑</button>
</header>

<main>
  <section class="setup" id="setupRoom">
    <div id="setup" class="banner warn hide">
      <strong>Not connected.</strong> Set <code>WORKER_URL</code> in the script to your
      Cloudflare Worker. Falling back to this browser's built-in voices for now.
    </div>

    <div class="urlpanel" id="urlpanel">
      <div class="urlrow">
        <input class="url" type="url" inputmode="url" spellcheck="false"
               placeholder="Paste a chapter link" aria-label="Chapter link">
      </div>

      <div class="loadrow">
        <label class="stepper" for="chainN">
          <span>read</span>
          <input id="chainN" type="number" min="1" max="15" step="1" value="1">
          <span>chapters from here</span>
        </label>
        <span class="spacer"></span>
        <button id="clearLinks" class="ghost" type="button">Clear</button>
        <button id="genImages" class="btn" type="button">Generate images</button>
        <button id="load" class="btn solid" type="button">Load</button>
      </div>

      <button id="toggleLinks" class="ghost hide" type="button" aria-expanded="true">Links</button>

      <div class="hist hide" id="hist">
        <div class="histhead">
          <button id="toggleHist" class="ghost histtoggle" type="button"
                  aria-expanded="true"><span id="histCount">Recently loaded</span></button>
          <button id="clearHist" class="ghost" type="button">Clear all</button>
        </div>
        <ul id="histList"></ul>
      </div>
    </div>

    <p class="seclabel fieldlabel">The text</p>
    <textarea id="text" placeholder="…or paste the chapter text itself" spellcheck="false"></textarea>
    <div class="charline"><span id="chars">0</span> characters</div>

    <div id="error" class="banner err hide"></div>

    <div class="quota">
      <div class="quotabar"><i id="quotaFill"></i></div>
      <span id="quotaText"></span>
    </div>
    <div id="foot"></div>
  </section>

  <div class="readwrap hide" id="readRoom">
    <div class="spine" id="spine"></div>
    <div id="reader" class="reader hide" aria-live="off"></div>
    <div class="imgrail" id="imgRail"></div>
  </div>
</main>

<footer class="dock">
  <div id="bar" class="hide"><i id="barFill"></i></div>
  <button id="speak" class="transport" type="button" aria-label="Speak">▶</button>
  <button id="stop" type="button" disabled aria-label="Stop">■</button>
  <span class="speedwrap">
    <input type="range" id="rate" min="0.5" max="2" step="0.1" value="1" aria-label="Speed">
    <span id="rateVal">1.0</span>×
  </span>
  <select id="voice" aria-label="Voice"></select>
  <span class="pitchwrap">
    <input type="range" id="pitch" min="-10" max="10" step="1" value="0" aria-label="Pitch">
    <span id="pitchVal">0</span>
  </span>

    try { localStorage.setItem('histOpen', open ? '1' : '0'); } catch (e) {}
    renderHist();
  }
  $('toggleHist').onclick = function () {
    setHistOpen(histList.classList.contains('hide'));
  };

  $('clearHist').onclick = function () {
    try { localStorage.removeItem(HIST_KEY); } catch (e) {}
    renderHist();
    say('History cleared.');
  };

  try { histList.classList.toggle('hide', localStorage.getItem('histOpen') === '0'); }
  catch (e) {}
  renderHist();

  toggleBtn.onclick = function () { setPanel(urlPanel.classList.contains('hide')); };
  $('clearLinks').onclick = function () {
    urlInputs.forEach(function (i) { i.value = ''; });
    urlInputs[0].focus();
  };

  function fetchOne(u) {
    return fetch(WORKER_URL + '/fetch?url=' + encodeURIComponent(u))
      .then(function (r) {
        if (!r.ok) return r.text().then(function (t) { throw new Error(t || ('HTTP ' + r.status)); });
        return r.json();
      });
  }

  // Read the boxes top to bottom, skipping blanks. Box 1 is read first.
  function collectUrls() {
    var out = [];
    urlInputs.forEach(function (inp) {
      inp.value.split(/[\s,]+/).forEach(function (u) { if (u) out.push(u); });
    });
    return out;
  }

  // With a count above 1, one link is enough — the Worker walks each page's
  // "next chapter" link from there, so the slugs don't have to be typed out.
  function chainCount() {
    var n = parseInt($('chainN').value, 10);
    return n > 1 ? Math.min(15, n) : 1;
  }

  function loadChain(append, first, n) {
    clearErr();
    showEditor();
    loadBtn.disabled = true;
    loadBtn.textContent = 'Loading…';
    say('Following ' + n + ' chapters…');

    fetch(WORKER_URL + '/chain?n=' + n + '&url=' + encodeURIComponent(first))
      .then(function (r) {
        if (!r.ok) return r.text().then(function (t) { throw new Error(t || ('HTTP ' + r.status)); });
        return r.json();
      })
      .then(function (d) {
        var pages = d.pages || d;              // tolerate the older shape
        var joined = pages.map(function (p) { return p.text; }).join('\n\n');
        textEl.value = append && textEl.value.trim()
          ? textEl.value.replace(/\s+$/, '') + '\n\n' + joined
          : joined;
        charsEl.textContent = textEl.value.length;

        addHist(pages.map(function (p) { return { url: p.url, title: p.title }; }));

        // Queue up where this run stopped, so "+ Add" just continues.
        var more = '';
        if (d.next) {
          urlInputs[0].value = d.next;
          more = ' Next chapter is queued — press Load to continue.';
        }

        say('Loaded ' + pages.length + ' chapter' + (pages.length > 1 ? 's' : '') +
            ', ' + textEl.value.split(/\n\s*\n/).length + ' paragraphs.' +
            (pages.length < n ? ' (chain ended early)' : '') + more);
      })
      .catch(function (e) { fail(e.message); say(''); })
      .finally(function () {
        loadBtn.disabled = false;
        loadBtn.textContent = 'Load';
      });
  }

  function loadUrls(append) {
    var list = collectUrls();
    if (!list.length) { setPanel(true); urlInputs[0].focus(); return; }

    if (list.length === 1) return loadChain(append, list[0], chainCount());
    if (!useWorker) { fail('Loading links needs the Worker configured.'); return; }

    clearErr();
    showEditor();
    loadBtn.disabled = true;
    loadBtn.textContent = 'Loading…';

    var out = [], titles = [], loaded = [], failed = 0;

    // One at a time, in the order given, so chapters stay in sequence.
    list.reduce(function (chain, u, i) {
      return chain.then(function () {
        say('Fetching ' + (i + 1) + ' of ' + list.length + '…');
        return fetchOne(u)
          .then(function (d) {
            out.push(d.text);
            if (d.title) titles.push(d.title);
            loaded.push({ url: u, title: d.title });
          })
          .catch(function () { failed++; });
      });
    }, Promise.resolve()).then(function () {
      if (!out.length) { fail('Could not load any of those links.'); say(''); return; }

      var joined = out.join('\n\n');
      textEl.value = append && textEl.value.trim()
        ? textEl.value.replace(/\s+$/, '') + '\n\n' + joined
        : joined;
      charsEl.textContent = textEl.value.length;
      // Leave the links in place so it's clear what was loaded; Clear empties them.
      addHist(loaded);

      var paras = textEl.value.split(/\n\s*\n/).length;
      say('Loaded ' + out.length + ' page' + (out.length > 1 ? 's' : '') +
          ', ' + paras + ' paragraphs' +
          (failed ? ' (' + failed + ' failed)' : '') +
          (titles.length === 1 ? ' — ' + titles[0] : '') + '.');
    }).finally(function () {
      loadBtn.disabled = false;
      loadBtn.textContent = 'Load';
    });
  }

  loadBtn.onclick = function () { loadUrls(false); };
  urlInputs.forEach(function (inp) {
    inp.onkeydown = function (e) { if (e.key === 'Enter') { e.preventDefault(); loadUrls(false); } };
  });

  // Click any paragraph to hear it again from its start.
  readerEl.onclick = function (e) {
    var p = e.target.closest ? e.target.closest('.para') : null;
    if (!p || p.__firstChunk === undefined || !curChunks.length) return;
    unlock();                       // this is a gesture — keep iOS happy
    clearErr();
    playFrom(p.__firstChunk);
  };

  // Called on every timeupdate while a chunk plays.
  function highlight(cs, ratio) {
    var target = ratio * cs.__total;
    var acc = 0, hit = null;
    for (var i = 0; i < cs.__words.length; i++) {
      acc += cs.__words[i].__len;
      if (acc >= target) { hit = cs.__words[i]; break; }
    }
    if (!hit || hit === lastWord) return;
    if (lastWord) { lastWord.classList.remove('now'); lastWord.classList.add('spoken'); }
    hit.classList.add('now');
    lastWord = hit;

    // Keep the live word in view without yanking the page around.
    var r = hit.getBoundingClientRect(), rr = readerEl.getBoundingClientRect();
    if (r.top < rr.top + 40 || r.bottom > rr.bottom - 40) {
      readerEl.scrollTop += (r.top - rr.top) - readerEl.clientHeight / 2;
    }
  }

  function playUrl(url, cs) {
    return new Promise(function (resolve, reject) {
      player.src = url;
      player.ontimeupdate = cs ? function () {
        if (player.duration) highlight(cs, player.currentTime / player.duration);
      } : null;
      player.onended = function () {
        if (cs) {
          cs.__words.forEach(function (w) { w.classList.remove('now'); w.classList.add('spoken'); });
          cs.classList.remove('live'); cs.classList.add('done');
          lastWord = null;
        }
        resolve();
      };
      player.onerror = function () { reject(new Error('Playback failed')); };
      var p = player.play();
      if (p && p.catch) p.catch(reject);
    });
  }

  // Kokoro runs in the browser. The model is ~86MB, so it's only fetched the
  // first time someone actually picks one of those voices.
  var kokoro = null;
  function loadKokoro() {
    if (kokoro) return kokoro;
    say('Downloading voice model… (one time, ~86MB)');
    progress(0);
    kokoro = import('https://cdn.jsdelivr.net/npm/kokoro-js@1.2.1/+esm')
      .then(function (m) {
        return m.KokoroTTS.from_pretrained('onnx-community/Kokoro-82M-v1.0-ONNX', {
          dtype: 'q8',
          device: 'wasm',
          progress_callback: function (p) {
            if (p.status === 'progress' && p.total) {
              var pct = (p.loaded / p.total) * 100;
              progress(pct);
              say('Downloading voice model… ' + Math.round(pct) + '% (one time only)');
            }
          }
        });
      })
      .catch(function (e) { kokoro = null; throw e; });
    return kokoro;
  }

  function kokoroChunk(text) {
    return loadKokoro().then(function (tts) {
      progress(null);
      return tts.generate(text, {
        voice: voiceEl.value.slice(7),        // strip the "kokoro:" prefix
        speed: +rate.value
      });
    }).then(function (audio) {
      var u = URL.createObjectURL(audio.toBlob());
      urls.push(u);
      return u;
    });
  }

  // ── Free-tier meter ───────────────────────────────────────────────────
  // The 1M characters a month is one shared pool for everyone using this site,
  // so the count lives in the Worker rather than in each browser. Google has no
  // live "remaining" figure of its own; this is the closest thing to one.
  var quotaBusy = false;

  function refreshQuota() {
    if (!useWorker || quotaBusy) return;
    quotaBusy = true;
    fetch(WORKER_URL + '/usage')
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (d) { if (d) renderQuota(d); })
      .catch(function () {})
      .finally(function () { quotaBusy = false; });
  }

  function renderQuota(d) {
    var limit = d.limit || 1000000;
    var left = Math.max(0, limit - (d.used || 0));
    var pct = Math.min(100, ((d.used || 0) / limit) * 100);

    $('quotaFill').style.width = pct + '%';
    $('quotaText').textContent =
      left.toLocaleString() + ' of ' + limit.toLocaleString() +
      ' free characters left this month' +
      (d.shared === false ? ' (not shared — Worker has no counter)' : '');
    $('quotaText').style.color = left < limit * 0.1 ? 'var(--errink)' : '';
  }

  function fetchChunk(text) {
    if (voiceEl.value.indexOf('kokoro:') === 0) return kokoroChunk(text);

    return fetch(WORKER_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        text: text, voice: voiceEl.value,
        rate: +rate.value, pitch: +pitch.value
      })
    }).then(function (r) {
      if (!r.ok) return r.text().then(function (t) { throw new Error(t || ('HTTP ' + r.status)); });
      return r.blob();
    }).then(function (b) {
      var u = URL.createObjectURL(b);
      urls.push(u);
      return u;
    });
  }

  // ── UI ───────────────────────────────────────────────────────
  textEl.addEventListener('input', function () { charsEl.textContent = textEl.value.length; });
  rate.oninput  = function () { $('rateVal').textContent  = (+rate.value).toFixed(1); };
  pitch.oninput = function () { $('pitchVal').textContent = pitch.value; };

  function busy(on) {
    speakBtn.disabled = on;
    stopBtn.disabled = !on;
    speakBtn.textContent = on ? '❚❚' : '▶';
  }

  function cleanup() {
    urls.forEach(function (u) { URL.revokeObjectURL(u); });
    urls = [];
  }

  // ── Speak ────────────────────────────────────────────────────
  speakBtn.onclick = function () {
    if (running) return;
    unlock();                       // synchronous, inside the gesture — required by iOS
    clearErr();

    var text = textEl.value.trim();
    if (!text) { say('Nothing to read — paste some text first.'); textEl.focus(); return; }

    cancelled = false;
    cleanup();

    if (!useWorker) { running = true; busy(true); return speakLocal(text); }

    curChunks = chunkText(text);
    curLabel = voiceEl.options[voiceEl.selectedIndex].textContent;
    curQueue = [];

    buildReader(curChunks);
    playFrom(0);
  };

  // Playback state lives out here so a click on a paragraph can jump into it.
  var curChunks = [], curQueue = [], curLabel = '';
  var runId = 0;                    // bumped on every jump; stale loops bail out

  function playFrom(start) {
    var myRun = ++runId;
    cancelled = false;
    running = true;
    busy(true);

    player.pause();
    player.onended = null;
    player.ontimeupdate = null;
    if (lastWord) { lastWord.classList.remove('now'); lastWord = null; }

    // Everything from here on is unread again.
    chunkEls.forEach(function (cs, i) {
      if (i >= start) {
        cs.classList.remove('done', 'live');
        cs.__words.forEach(function (w) { w.classList.remove('spoken', 'now'); });
      }
    });

    say('Connecting…');
    progress((start / curChunks.length) * 100);

    for (var i = start; i < Math.min(start + LOOKAHEAD, curChunks.length); i++) {
      if (!curQueue[i]) curQueue[i] = fetchChunk(curChunks[i].text);
    }

    var i2 = start;
    (function next() {
      if (myRun !== runId) return;            // a jump superseded this loop
      if (cancelled || i2 >= curChunks.length) {
        if (!cancelled) { say('Done.'); progress(100); setTimeout(function(){progress(null);}, 600); }
        busy(false); running = false;
        refreshQuota();          // the Worker counted what it synthesized
        return;
      }

      var idx = i2++;
      // Keep the pipeline topped up so the next chunk is ready before this one ends.
      var ahead = idx + LOOKAHEAD;
      if (ahead < curChunks.length && !curQueue[ahead]) curQueue[ahead] = fetchChunk(curChunks[ahead].text);

      curQueue[idx].then(function (url) {
        if (myRun !== runId) return;
        if (cancelled) throw new Error('cancelled');
        say(curChunks.length > 1
          ? curLabel + ' — part ' + (idx + 1) + ' of ' + curChunks.length
          : 'Playing ' + curLabel + '…');
        progress((idx / curChunks.length) * 100);
        var cs = chunkEls[idx];
        if (cs) {
          cs.classList.add('live');
          cs.scrollIntoView({ block: 'nearest' });
        }
        return playUrl(url, cs);
      }).then(function () {
        if (myRun === runId) next();
      }).catch(function (e) {
        if (myRun !== runId) return;
        busy(false); running = false; progress(null);
        if (cancelled) { say('Stopped.'); return; }
        fail(e.name === 'NotAllowedError'
          ? 'Your browser blocked autoplay. Tap Speak again.'
          : e.message);
        say('');
      });
    })();
  }

  function speakLocal(text) {
    if (!window.speechSynthesis) { fail('No speech support in this browser.'); busy(false); running = false; return; }
    speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(text);
    var v = browserVoices[voiceEl.value];
    if (v) { u.voice = v; u.lang = v.lang; }
    u.rate = +rate.value;
    u.pitch = 1 + (+pitch.value / 10);
    u.onstart = function () { say('Speaking with ' + (v ? v.name : 'default') + '…'); };
    u.onend   = function () { busy(false); running = false; say('Done.'); };
    u.onerror = function () { busy(false); running = false; say('Stopped.'); };
    speechSynthesis.speak(u);
  }

  stopBtn.onclick = function () {
    cancelled = true;
    player.pause(); player.currentTime = 0; player.onended = null; player.ontimeupdate = null;
    if (lastWord) { lastWord.classList.remove('now'); lastWord = null; }
    if (!useWorker && window.speechSynthesis) speechSynthesis.cancel();
    busy(false); running = false; progress(null);
    say('Stopped.');
  };

  // ── The spine, the two rooms, and the theme ───────────────────────────
  // The chapter drawn as one tick per paragraph, tick length proportional to
  // that paragraph's length, so a chapter has a silhouette: dialogue stutters,
  // description runs solid. It is the scrubber, the position readout and the
  // replay affordance in one object. It steps once per paragraph — never fills
  // continuously, because a permanently moving thing 40px from the line you are
  // reading is noise.
  var spineEl = $('spine'), readRoom = $('readRoom'), setupRoom = $('setupRoom');
  var chapterId = $('chapterId'), partCount = $('partCount'), themeBtn = $('theme');
  var ticks = [];

  function applyTheme(t) {
    if (t) document.documentElement.setAttribute('data-theme', t);
    else document.documentElement.removeAttribute('data-theme');
    try { localStorage.setItem('theme', t || ''); } catch (e) {}
  }
  try { var savedTheme = localStorage.getItem('theme'); if (savedTheme) applyTheme(savedTheme); } catch (e) {}

  themeBtn.onclick = function () {
    var cur = document.documentElement.getAttribute('data-theme');
    var sysDark = window.matchMedia && window.matchMedia('(prefers-color-scheme:dark)').matches;
    applyTheme(cur ? (cur === 'dark' ? 'light' : '') : (sysDark ? 'light' : 'dark'));
  };

  function buildSpine() {
    spineEl.innerHTML = '';
    ticks = [];
    var paras = [].slice.call(readerEl.querySelectorAll('.para'));
    if (!paras.length) return;

    // Cap the tick count. A five-chapter run is ~300 paragraphs; without this
    // the pitch falls under 3px and the targets become unhittable.
    var h = spineEl.clientHeight || 420;
    var slots = Math.min(140, Math.max(8, Math.floor(h / 6)));
    var step = Math.max(1, Math.ceil(paras.length / slots));

    var groups = [];
    for (var i = 0; i < paras.length; i += step) groups.push(paras.slice(i, i + step));
    var pitch = h / groups.length;

    // Anchor to the reader's real box. 60ch resolves against each element's own
    // font, so the CSS value would land the spine under the prose.
    var rr = readerEl.getBoundingClientRect();
    var gap = window.innerWidth <= 760 ? 22 : 40;
    spineEl.style.left = Math.max(6, Math.round(rr.left - gap)) + 'px';

    groups.forEach(function (g, gi) {
      var avg = g.reduce(function (n, p) { return n + p.textContent.length; }, 0) / g.length;
      var t = document.createElement('i');
      t.style.top = Math.round(gi * pitch + pitch / 2) + 'px';
      t.style.width = Math.round(Math.max(6, Math.min(18, 6 + avg / 40))) + 'px';
      t.title = g[0].textContent.trim().split(/\s+/).slice(0, 5).join(' ');
      t.onclick = function () {
        unlock();                       // gesture — must be first, iOS
        if (g[0].__firstChunk !== undefined) playFrom(g[0].__firstChunk);
      };
      spineEl.appendChild(t);
      ticks.push({ el: t, paras: g });
    });
    markSpine();
  }

  function markSpine() {
    var live = readerEl.querySelector('.chunk.live');
    var livePara = live && live.parentNode;
    var at = -1;
    for (var i = 0; i < ticks.length; i++) {
      if (livePara && ticks[i].paras.indexOf(livePara) !== -1) { at = i; break; }
    }
    ticks.forEach(function (t, i) {
      t.el.classList.toggle('at', i === at);
      t.el.classList.toggle('lit', at >= 0 && i < at);
    });
  }

  function syncRooms() {
    var reading = !readerEl.classList.contains('hide');
    readRoom.classList.toggle('hide', !reading);
    setupRoom.classList.toggle('hide', reading);
    document.body.classList.toggle('mode-read', reading);
    if (reading) {
      var first = histList.querySelector('button.pick');
      chapterId.textContent = first ? first.textContent.replace(/\s*-\s*[^-]*$/, '') : '';
      buildSpine();
    }
  }

  function syncHasText() {
    document.body.classList.toggle('has-text', textEl.value.trim().length > 0);
  }

  // The reader's own .hide class is the source of truth for which room we're in.
  new MutationObserver(syncRooms).observe(readerEl, { attributes: true, attributeFilter: ['class'] });

  // Chunk-level class changes move the spine. Word spans change far more often,
  // so filter to .chunk or this fires once per spoken word.
  new MutationObserver(function (muts) {
    for (var i = 0; i < muts.length; i++) {
      var t = muts[i].target;
      if (t.classList && t.classList.contains('chunk')) { markSpine(); return; }
    }
  }).observe(readerEl, { subtree: true, attributes: true, attributeFilter: ['class'] });

  // Chrome recedes while the voice is running — on state, never on a timer.
  new MutationObserver(function () {
    document.body.classList.toggle('running', speakBtn.disabled);
  }).observe(speakBtn, { attributes: true, attributeFilter: ['disabled'] });

  // The character count updates on every load, including programmatic ones,
  // which makes it a reliable proxy for "the text changed".
  new MutationObserver(syncHasText).observe(charsEl, { childList: true, characterData: true, subtree: true });
  textEl.addEventListener('input', syncHasText);

  // The part counter belongs in the header, not buried in the status line.
  new MutationObserver(function () {
    var m = /part (\d+) of (\d+)/.exec(statusEl.textContent);
    partCount.textContent = m ? m[1] + ' / ' + m[2] : '';
  }).observe(statusEl, { childList: true, characterData: true, subtree: true });

  // The URL bar collapsing on iOS changes available height mid-session, which
  // would otherwise leave the tick geometry stale.
  var spineTimer = null;
  function reflowSpine() {
    clearTimeout(spineTimer);
    spineTimer = setTimeout(function () {
      if (!readerEl.classList.contains('hide')) buildSpine();
    }, 150);
  }
  window.addEventListener('resize', reflowSpine);
  if (window.visualViewport) window.visualViewport.addEventListener('resize', reflowSpine);

  // ── Chapter imagery ───────────────────────────────────────────────────
  // Generated in setup, before Speak, so the 30-second wait never lands in the
  // middle of a read. Five atmospheric images, each anchored to the paragraph
  // it came from. Cached in IndexedDB by chapter, so pressing twice is free.
  var genBtn = $('genImages'), imgRail = $('imgRail'), imgSheet = $('imgSheet');
  var imgChip = $('imgChip'), imgCount = $('imgCount'), sheetClose = $('sheetClose');
  var images = [], imgUrls = [];

  function hashText(t) {
    var h = 5381;
    for (var i = 0; i < t.length; i++) h = ((h << 5) + h + t.charCodeAt(i)) | 0;
    return 'ch' + (h >>> 0).toString(36) + ':' + t.length;
  }

  function idb() {
    return new Promise(function (res, rej) {
      var r = indexedDB.open('speak-images', 1);
      r.onupgradeneeded = function () { r.result.createObjectStore('img'); };
      r.onsuccess = function () { res(r.result); };
      r.onerror = function () { rej(r.error); };
    });
  }
  function idbGet(k) {
    return idb().then(function (db) {
      return new Promise(function (res) {
        var q = db.transaction('img').objectStore('img').get(k);
        q.onsuccess = function () { res(q.result || null); };
        q.onerror = function () { res(null); };
      });
    }).catch(function () { return null; });
  }
  function idbPut(k, v) {
    return idb().then(function (db) {
      db.transaction('img', 'readwrite').objectStore('img').put(v, k);
    }).catch(function () {});
  }

  function revokeImages() {
    imgUrls.forEach(function (u) { URL.revokeObjectURL(u); });
    imgUrls = [];
  }

  function card(item, i) {
    var url = URL.createObjectURL(item.blob);
    imgUrls.push(url);
    var fig = document.createElement('figure');
    fig.className = 'imgcard';
    var im = document.createElement('img');
    im.src = url;
    im.alt = item.prompt;
    im.loading = 'lazy';
    im.decoding = 'async';
    var cap = document.createElement('figcaption');
    cap.textContent = item.prompt;
    fig.appendChild(im);
    fig.appendChild(cap);
    fig.onclick = function () { fig.classList.toggle('open'); };
    return fig;
  }

  // The rail lives inside the scrolling column, so it scrolls with the prose —
  // each image ends up level with the paragraph it came from, no scroll handler.
  function placeImages() {
    imgRail.innerHTML = '';
    if (!images.length || readerEl.classList.contains('hide')) return;
    var paras = [].slice.call(readerEl.querySelectorAll('.para'));
    if (!paras.length) return;

    var lastBottom = -1e9;
    images.forEach(function (item, i) {
      var p = paras[Math.min(paras.length - 1, item.para)] || paras[0];
      var fig = card(item, i);
      fig.style.position = 'absolute';
      // Never let two cards collide; push down when the anchors are close.
      var top = Math.max(p.offsetTop, lastBottom + 24);
      fig.style.top = top + 'px';
      lastBottom = top + 190;
      imgRail.appendChild(fig);
    });
  }

  function fillSheet() {
    imgSheet.querySelector('.sheetbody').innerHTML = '';
    var body = imgSheet.querySelector('.sheetbody');
    images.forEach(function (item, i) { body.appendChild(card(item, i)); });
  }

  function renderImages() {
    revokeImages();
    imgCount.textContent = images.length;
    imgChip.classList.toggle('hide', !images.length);
    placeImages();
    fillSheet();
  }

  imgChip.onclick = function () {
    if (window.innerWidth <= 1200) {
      imgSheet.classList.toggle('hide');
    } else {
      document.body.classList.toggle('rail-open');
    }
  };
  sheetClose.onclick = function () { imgSheet.classList.add('hide'); };

  genBtn.onclick = function () {
    var text = textEl.value.trim();
    if (!text) { say('Load a chapter first.'); return; }
    if (!useWorker) { fail('Image generation needs the Worker configured.'); return; }

    clearErr();
    genBtn.disabled = true;
    var key = hashText(text);

    idbGet(key).then(function (cached) {
      if (cached && cached.length) {
        images = cached;
        renderImages();
        say(cached.length + ' images ready (from this device).');
        return null;
      }
      genBtn.textContent = 'Reading the chapter…';
      return fetch(WORKER_URL + '/scenes', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text: text, count: 5 })
      }).then(function (r) {
        if (!r.ok) return r.text().then(function (t) { throw new Error(t || 'HTTP ' + r.status); });
        return r.json();
      }).then(function (scenes) {
        images = [];
        // One at a time, so each picture appears as it lands.
        return scenes.reduce(function (chain, sc, i) {
          return chain.then(function () {
            genBtn.textContent = 'Drawing ' + (i + 1) + ' of ' + scenes.length + '…';
            return fetch(WORKER_URL + '/image', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ prompt: sc.prompt })
            }).then(function (r) {
              if (!r.ok) return r.text().then(function (t) { throw new Error(t || 'HTTP ' + r.status); });
              return r.blob();
            }).then(function (blob) {
              images.push({ para: sc.para, prompt: sc.prompt, blob: blob });
              renderImages();
            });
          });
        }, Promise.resolve()).then(function () {
          if (images.length) idbPut(key, images);
          say(images.length + ' images ready.');
        });
      });
    }).catch(function (e) {
      fail(e.message || 'Could not generate images.');
    }).finally(function () {
      genBtn.disabled = false;
      genBtn.textContent = 'Generate images';
    });
  };

  new MutationObserver(function () { placeImages(); })
    .observe(readerEl, { attributes: true, attributeFilter: ['class'] });
  window.addEventListener('resize', function () { placeImages(); });

  urlPanel.classList.remove('hide');   // the loader is permanent in this layout
  syncHasText();
  syncRooms();

  refreshQuota();
})();
</script>
</body>
</html>
