<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Speak</title>
<style>
  :root{
    --bg:#f6f5f3; --panel:#fff; --ink:#16151a; --muted:#6b6a72;
    --line:#e2e0dc; --accent:#2f5bd8; --accent-ink:#fff;
    --shadow:0 1px 2px rgba(0,0,0,.05),0 8px 24px rgba(0,0,0,.06);
    --errbg:#fdeaea; --errline:#f5bcbc; --errink:#8a2020;
    --track:#e8e6e2;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#131316; --panel:#1c1c20; --ink:#f0eff2; --muted:#9b9aa3;
      --line:#2e2e34; --accent:#7c9bff; --accent-ink:#10101a;
      --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.3);
      --errbg:#2d1616; --errline:#5e2626; --errink:#ffb4b4;
      --track:#2a2a30;
    }
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font:15px/1.55 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
    display:flex; justify-content:center; padding:48px 16px 64px;
  }
  main{width:100%; max-width:680px}
  h1{font-size:26px; letter-spacing:-.02em; margin:0 0 4px}
  .sub{color:var(--muted); margin:0 0 28px; font-size:14px}
  .card{background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:18px; box-shadow:var(--shadow)}
  textarea{
    width:100%; min-height:180px; resize:vertical; padding:14px;
    background:transparent; color:var(--ink); border:1px solid var(--line);
    border-radius:10px; font:inherit; line-height:1.6;
  }
  textarea:focus{outline:2px solid var(--accent); outline-offset:1px; border-color:transparent}
  textarea:disabled{opacity:.6}
  label{font-size:12px; color:var(--muted); display:block; margin-bottom:5px; letter-spacing:.02em}
  select{
    padding:9px 10px; border-radius:9px; border:1px solid var(--line);
    background:var(--panel); color:var(--ink); font:inherit; width:100%;
  }
  .row{margin-top:14px}
  .sliders{display:flex; gap:16px; margin-top:14px}
  .sliders>div{flex:1}
  input[type=range]{width:100%; accent-color:var(--accent)}
  .buttons{display:flex; gap:10px; flex-wrap:wrap; margin-top:16px; align-items:center}
  button{
    padding:11px 20px; border-radius:9px; border:1px solid var(--line);
    background:var(--panel); color:var(--ink); font:inherit; font-weight:500; cursor:pointer;
  }
  button:hover:not(:disabled){border-color:var(--muted)}
  button.primary{background:var(--accent); color:var(--accent-ink); border-color:transparent}
  button.primary:hover:not(:disabled){filter:brightness(1.08)}
  button:disabled{opacity:.45; cursor:not-allowed}
  a.dl{text-decoration:none}
  .count{margin-left:auto; font-size:12px; color:var(--muted); font-variant-numeric:tabular-nums}
  .status{margin-top:14px; font-size:13px; color:var(--muted); min-height:20px}
  .bar{height:4px; background:var(--track); border-radius:2px; overflow:hidden; margin-top:12px}
  .bar>i{display:block; height:100%; width:0; background:var(--accent); transition:width .25s ease}
  .banner{padding:12px 14px; border-radius:10px; font-size:14px; border:1px solid; margin-top:14px}
  .banner.err{background:var(--errbg); border-color:var(--errline); color:var(--errink)}
  .hide{display:none}
  .spin{display:inline-block; width:11px; height:11px; border:2px solid currentColor;
        border-right-color:transparent; border-radius:50%; animation:sp .7s linear infinite;
        vertical-align:-1px; margin-right:6px}
  @keyframes sp{to{transform:rotate(360deg)}}
  footer{margin-top:18px; font-size:12px; color:var(--muted); text-align:center}
</style>
</head>
<body>
<main>
  <h1>Speak</h1>
  <p class="sub">Paste text, pick a voice, press play.</p>

  <div class="card">
    <textarea id="text" placeholder="Paste or type your text here…" spellcheck="false" disabled></textarea>

    <div class="row">
      <label for="voice">Voice</label>
      <select id="voice" disabled></select>
    </div>

    <div class="sliders">
      <div>
        <label for="rate">Speed &middot; <span id="rateVal">1.0</span>&times;</label>
        <input type="range" id="rate" min="0.5" max="2" step="0.1" value="1" disabled>
      </div>
    </div>

    <div class="buttons">
      <button id="speak" class="primary" disabled>▶ Speak</button>
      <button id="stop" disabled>⏹ Stop</button>
      <a id="dl" class="dl hide" download="speech.wav"><button type="button">⬇ Download</button></a>
      <span class="count"><span id="chars">0</span> characters</span>
    </div>

    <div class="bar hide" id="bar"><i id="barFill"></i></div>
    <div class="status" id="status">Loading the voice model…</div>
    <div id="error" class="banner err hide"></div>
  </div>

  <audio id="player" class="hide"></audio>
  <footer>Runs entirely in your browser. Nothing is uploaded.</footer>
</main>

<script type="module">
import { KokoroTTS } from 'https://cdn.jsdelivr.net/npm/kokoro-js@1.2.1/+esm';

const MODEL = 'onnx-community/Kokoro-82M-v1.0-ONNX';

// Text of any length is split into pieces this size, generated one at a time.
// Playback starts as soon as the first piece is ready, so long documents don't
// mean a long wait before you hear anything.
const CHUNK_TARGET = 350;

const VOICES = [
  ['am_michael', 'Michael — American male'],
  ['am_adam',    'Adam — American male'],
  ['am_echo',    'Echo — American male'],
  ['bm_george',  'George — British male'],
  ['bm_lewis',   'Lewis — British male'],
  ['af_heart',   'Heart — American female'],
  ['af_bella',   'Bella — American female'],
  ['bf_emma',    'Emma — British female'],
];

const $ = id => document.getElementById(id);
const textEl = $('text'), voiceEl = $('voice'), statusEl = $('status'), errEl = $('error');
const speakBtn = $('speak'), stopBtn = $('stop'), player = $('player');
const rate = $('rate'), charsEl = $('chars'), bar = $('bar'), barFill = $('barFill');
const dl = $('dl');

let tts = null;
let cancelled = false;
let running = false;
let urls = [];            // object URLs for the queued chunks
let pcm = [];             // raw samples, kept so Download can stitch one file
let sampleRate = 24000;

const say = m => { statusEl.textContent = m; };
const fail = m => { errEl.textContent = m; errEl.classList.remove('hide'); };
const clearErr = () => errEl.classList.add('hide');

function setProgress(pct) {
  if (pct == null) { bar.classList.add('hide'); return; }
  bar.classList.remove('hide');
  barFill.style.width = Math.max(0, Math.min(100, pct)) + '%';
}

// ── Split text without cutting sentences in half ─────────────
function chunkText(text) {
  // Sentence-ish boundaries, keeping the punctuation attached.
  const sentences = text.replace(/\s+/g, ' ').trim().match(/[^.!?…]+[.!?…]+["')\]]*|\S+$/g) || [];
  const out = [];
  let buf = '';

  for (let s of sentences) {
    s = s.trim();
    if (!s) continue;

    // A single sentence longer than the target gets broken at commas, then spaces.
    if (s.length > CHUNK_TARGET * 2) {
      if (buf) { out.push(buf); buf = ''; }
      let rest = s;
      while (rest.length > CHUNK_TARGET * 2) {
        let cut = rest.lastIndexOf(',', CHUNK_TARGET);
        if (cut < CHUNK_TARGET / 2) cut = rest.lastIndexOf(' ', CHUNK_TARGET);
        if (cut < 1) cut = CHUNK_TARGET;
        out.push(rest.slice(0, cut + 1).trim());
        rest = rest.slice(cut + 1);
      }
      if (rest.trim()) buf = rest.trim();
      continue;
    }

    if (buf && (buf + ' ' + s).length > CHUNK_TARGET) { out.push(buf); buf = s; }
    else { buf = buf ? buf + ' ' + s : s; }
  }
  if (buf) out.push(buf);
  return out;
}

// ── Minimal 16-bit PCM WAV encoder, for the Download button ──
function encodeWav(chunks, rate) {
  const total = chunks.reduce((n, c) => n + c.length, 0);
  const buf = new ArrayBuffer(44 + total * 2);
  const view = new DataView(buf);
  const str = (off, s) => { for (let i = 0; i < s.length; i++) view.setUint8(off + i, s.charCodeAt(i)); };

  str(0, 'RIFF'); view.setUint32(4, 36 + total * 2, true); str(8, 'WAVE');
  str(12, 'fmt '); view.setUint32(16, 16, true);
  view.setUint16(20, 1, true); view.setUint16(22, 1, true);
  view.setUint32(24, rate, true); view.setUint32(28, rate * 2, true);
  view.setUint16(32, 2, true); view.setUint16(34, 16, true);
  str(36, 'data'); view.setUint32(40, total * 2, true);

  let off = 44;
  for (const c of chunks) {
    for (let i = 0; i < c.length; i++, off += 2) {
      const v = Math.max(-1, Math.min(1, c[i]));
      view.setInt16(off, v < 0 ? v * 0x8000 : v * 0x7fff, true);
    }
  }
  return new Blob([buf], { type: 'audio/wav' });
}

// ── Load the model ───────────────────────────────────────────
(async function init() {
  try {
    setProgress(0);
    tts = await KokoroTTS.from_pretrained(MODEL, {
      dtype: 'q8',
      device: 'wasm',
      progress_callback: (p) => {
        if (p.status === 'progress' && p.total) {
          const pct = (p.loaded / p.total) * 100;
          setProgress(pct);
          say(`Downloading voice model… ${Math.round(pct)}% (one time only)`);
        }
      },
    });

    VOICES.forEach(([id, label]) => {
      const o = document.createElement('option');
      o.value = id; o.textContent = label;
      voiceEl.appendChild(o);
    });

    setProgress(null);
    [textEl, voiceEl, rate, speakBtn].forEach(el => { el.disabled = false; });
    say('Ready. Paste any length — playback starts right away.');
    textEl.focus();
  } catch (e) {
    setProgress(null);
    say('');
    fail('Could not load the voice model: ' + e.message);
  }
})();

// ── UI ───────────────────────────────────────────────────────
textEl.addEventListener('input', () => { charsEl.textContent = textEl.value.length; });
rate.oninput = () => { $('rateVal').textContent = (+rate.value).toFixed(1); };

function busy(on) {
  speakBtn.disabled = on;
  stopBtn.disabled = !on;
  speakBtn.innerHTML = on ? '<span class="spin"></span>Speaking…' : '▶ Speak';
}

function playUrl(url) {
  return new Promise((resolve, reject) => {
    player.src = url;
    player.onended = resolve;
    player.onerror = () => reject(new Error('playback failed'));
    player.play().catch(reject);
  });
}

function cleanup() {
  urls.forEach(URL.revokeObjectURL);
  urls = [];
}

// ── Speak ────────────────────────────────────────────────────
speakBtn.onclick = async () => {
  if (running) return;
  clearErr();
  const text = textEl.value.trim();
  if (!text) { say('Nothing to read — paste some text first.'); textEl.focus(); return; }

  cancelled = false;
  running = true;
  busy(true);
  dl.classList.add('hide');
  cleanup();
  pcm = [];

  const chunks = chunkText(text);
  const voice = voiceEl.value;
  const speed = +rate.value;
  const voiceLabel = voiceEl.options[voiceEl.selectedIndex].textContent;

  // Generation runs ahead of playback: while chunk N plays, N+1 is being made.
  let pending = null;
  const makeChunk = (i) => tts.generate(chunks[i], { voice, speed });

  try {
    setProgress(0);
    pending = makeChunk(0);

    for (let i = 0; i < chunks.length; i++) {
      if (cancelled) break;

      say(chunks.length > 1
        ? `${voiceLabel} — part ${i + 1} of ${chunks.length}`
        : `Playing ${voiceLabel}…`);

      const audio = await pending;
      if (cancelled) break;

      sampleRate = audio.sampling_rate || sampleRate;
      pcm.push(audio.audio);

      // Kick off the next one before playing this one, so there's no gap.
      pending = (i + 1 < chunks.length) ? makeChunk(i + 1) : null;

      const url = URL.createObjectURL(audio.toBlob());
      urls.push(url);

      setProgress(((i + 1) / chunks.length) * 100);
      await playUrl(url);
    }

    if (!cancelled) {
      dl.href = URL.createObjectURL(encodeWav(pcm, sampleRate));
      dl.classList.remove('hide');
      say('Done.');
    }
  } catch (e) {
    if (!cancelled) { fail('Generation failed: ' + e.message); say(''); }
  } finally {
    // Swallow the abandoned generation so it can't surface as an unhandled rejection.
    if (pending) pending.catch(() => {});
    setProgress(null);
    busy(false);
    running = false;
  }
};

stopBtn.onclick = () => {
  cancelled = true;
  player.pause();
  player.currentTime = 0;
  player.onended = null;
  busy(false);
  setProgress(null);
  say('Stopped.');
};
</script>
</body>
</html>
